<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cosy Cats</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%23e0903f' d='M2 2l3 3h6l3-3v9l-3 3H5l-3-3z'/%3E%3Cpath fill='%232a2731' d='M5 8h2v2H5zM9 8h2v2H9z'/%3E%3C/svg%3E">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="labels"></div>
  <div id="menu" class="hide"></div>
  <div id="toast"></div>
  <div id="hud" class="hide">
    <button data-act="nap" aria-label="curl up for a nap"><svg viewBox="0 0 16 16" shape-rendering="crispEdges"><path fill="#ffe2a6" d="M6 2h4v1h2v2h1v6h-1v2h-2v1H6v-1H4v-1h3v-1h2V9h1V6H9V4H7V3H6z"/></svg></button>
    <button data-act="paw" aria-label="choose cats"><svg viewBox="0 0 16 16" shape-rendering="crispEdges"><path fill="#e0903f" d="M3 5h2v3H3zM6 2h2v4H6zM9 2h2v4H9zM12 5h2v3h-2zM5 9h1V8h5v1h1v2h1v2h-1v1H4v-1H3v-2h1V9z"/></svg></button>
  </div>
  <div id="title">
    <h1>cosy cats</h1>
    <p class="go">press any button, or tap</p>
    <div class="keys">
      <span>walk and climb</span><span>stick</span><span>arrows</span>
      <span>jump</span><span>A</span><span>space</span>
      <span>pick up, eat, hop on, curl up</span><span>X</span><span>E</span>
      <span>meow</span><span>Y</span><span>Q</span>
      <span>swap cats</span><span>LB RB</span><span>tab</span>
      <span>choose cats</span><span>start</span><span>enter</span>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
