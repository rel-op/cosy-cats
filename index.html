<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cosy Cats</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="sky"></div>
  <canvas id="stars"></canvas>
  <canvas id="game"></canvas>
  <div id="vignette"></div>
  <div id="labels"></div>
  <div id="night"></div>
  <div id="toast"></div>
  <div id="title">
    <h1>cosy cats</h1>
    <p class="go">press any button</p>
    <table class="keys">
      <tr><th></th><th>gamepad</th><th>keyboard</th></tr>
      <tr><td>walk and climb</td><td>stick</td><td>arrows / WASD</td></tr>
      <tr><td>jump</td><td>A</td><td>space</td></tr>
      <tr><td>pick up, hop on, curl up</td><td>X or B</td><td>E</td></tr>
      <tr><td>meow</td><td>Y</td><td>Q</td></tr>
      <tr><td>swap cats</td><td>LB / RB</td><td>tab</td></tr>
    </table>
    <p class="small">a second gamepad can join at any time</p>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
